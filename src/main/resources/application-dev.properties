# Local development database settings (can be overridden with environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/loan_management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# Use your local frontend URL in dev
app.domain-url=${APP_DOMAIN_URL:http://localhost:3000}
